name: Native engine tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r native-engine/requirements.txt
      - run: python -m unittest test_engine -v
        working-directory: native-engine
