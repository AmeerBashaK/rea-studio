name: Native engine tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r native-engine/requirements-test.txt
      - run: python -m unittest test_engine test_differential -v
        working-directory: native-engine

  storage-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: New-Item -ItemType Directory -Force verification
      - run: node --test desktop/result-store.test.cjs desktop/graph-layout.test.cjs
